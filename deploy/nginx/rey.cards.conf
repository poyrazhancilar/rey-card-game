# Bootstrap configuration. Copy this before the first certificate is issued.
# The root-level reycardsetup.sh creates the final TLS configuration after
# Certbot has successfully created the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name rey.cards;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
