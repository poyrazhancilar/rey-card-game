services:
  rey:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be configured in .env}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
      RECONNECT_GRACE_MS: "${RECONNECT_GRACE_MS:-180000}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
